[package]
name = "lightwispr-llm"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Text enhancement worker for lightwispr (llama.cpp, spoken to over stdin/stdout)"
repository = "https://github.com/jan-stecher/lightwispr"

[dependencies]
anyhow = "1.0.104"
llama-cpp-2 = "0.1.160"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[features]
# GPU offload via Vulkan (needs vulkan-headers and glslc to build).
vulkan = ["llama-cpp-2/vulkan"]
